
name: latihanresponsi_citsit
description: Aplikasi latihan responsi Flutter
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Untuk mengambil data dari API.
  http: ^1.4.0

  # Untuk menyimpan session login dan data favorit.
  shared_preferences: ^2.5.3

  # Untuk membuka link berita dari API.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
